name: Lean build and axiom audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            --output /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib cache
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if lake exe cache get; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency download failed; retrying (attempt $((attempt + 1))/3)."
              sleep 10
            fi
          done
          exit 1
      - name: Compile all project modules
        run: lake build
      - name: Audit imported project namespace
        shell: bash
        run: |
          set -o pipefail
          lake env lean Audit.lean | tee axiom-audit.log
